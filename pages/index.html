<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APL Horse Race Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            padding: 20px;
            text-transform: uppercase;
        }
        .paper-container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .header {
            background: #eee;
            padding: 10px 20px;
            border-bottom: 1px solid #ccc;
            font-size: 0.85em;
            color: #666;
        }
        .greenbar {
            height: 500px;
            overflow-y: auto;
            background: repeating-linear-gradient(
                to bottom,
                #fff 0px,
                #fff 20px,
                #e8f5e9 20px,
                #e8f5e9 40px
            );
            padding: 10px 20px;
            line-height: 20px;
            font-size: 14px;
            color: #000;
            display: flex;
            flex-direction: column;
        }
        .spacer {
            flex: 1;
        }
        #output {
            white-space: pre;
        }
        .prompt-area {
            background: #fafafa;
            padding: 10px 20px;
            border-top: 1px solid #ccc;
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #000;
            margin-right: 8px;
            font-weight: bold;
        }
        #input {
            background: transparent;
            border: none;
            color: transparent;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            flex: 1;
            caret-color: transparent;
        }
        .links {
            padding: 15px 20px;
            text-align: center;
            font-size: 0.85em;
            background: #fafafa;
            border-top: 1px solid #eee;
        }
        .links a {
            color: #0066cc;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }

        .github-corner {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 100;
        }
        .github-corner svg {
            fill: #006600;
            color: #f5f5f5;
        }
        .github-corner:hover .octo-arm {
            animation: octocat-wave 560ms ease-in-out;
        }
        @keyframes octocat-wave {
            0%, 100% { transform: rotate(0); }
            20%, 60% { transform: rotate(-25deg); }
            40%, 80% { transform: rotate(10deg); }
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: #2a2a3a;
            border: 3px solid #4a4a5a;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
        }
        .modal h1 {
            color: #00cc00;
            font-size: 1.4em;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .modal h2 {
            color: #00ff00;
            font-size: 1.8em;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }
        .start-btn {
            background: #006600;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 50px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2em;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .start-btn:hover {
            background: #008800;
        }
        .modal-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <a href="https://github.com/sw-comp-history/apl-horse-race" class="github-corner" aria-label="View source on GitHub" target="_blank">
        <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z" />
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin:130px 106px;" class="octo-arm" />
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" />
        </svg>
    </a>

    <!-- Start Modal -->
    <div class="modal-overlay" id="startModal">
        <div class="modal">
            <h1>IBM 2741 TERMINAL EMULATOR</h1>
            <h2>A P L \ 3 6 0</h2>
            <button class="start-btn" id="startBtn">START</button>
        </div>
    </div>

    <div class="paper-container">
        <div class="header">
            APL\360 &mdash; 15 CPS SELECTRIC SIMULATION
        </div>
        <div class="greenbar" id="greenbar">
            <div class="spacer"></div>
            <div id="output"></div>
        </div>
        <div class="prompt-area">
            <span class="prompt">      </span>
            <input type="text" id="input" autocomplete="off">
        </div>
        <div class="links">
            <span>MIT License</span>
            &middot;
            <span>&copy; 2026 Michael A Wright</span>
            &middot;
            <a href="https://software-wrighter-lab.github.io/" target="_blank">Blog</a>
            &middot;
            <a href="https://discord.com/invite/Ctzk5uHggZ" target="_blank">Discord</a>
            &middot;
            <a href="https://www.youtube.com/@SoftwareWrighter" target="_blank">YouTube</a>
            &middot;
            <a href="https://github.com/sw-comp-history/apl-horse-race">Source Code</a>
            &middot;
            <a href="https://github.com/sw-comp-history/apl-horse-race/blob/main/docs/race-apl-explained.md">Documentation</a>
        </div>
    </div>

    <script>
        const horses = ['LUCKY', 'THUNDER', 'SHADOW', 'COMET', 'BLAZE'];
        const finishLine = 17;

        // 15 CPS = ~67ms per char, with noise
        const baseCharDelay = 67;
        const noiseChance = 0.15;
        const noisePause = 100;

        // Audio for typewriter clicks
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playClick(char) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // Consistent frequency based on character code
            const charCode = char ? char.charCodeAt(0) : 65;
            const freq = 1600 + (charCode % 26) * 25;
            osc.frequency.value = freq;
            osc.type = 'square';

            gain.gain.value = 0.1;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        function playSpaceClick() {
            if (!audioCtx) return;
            // Lighter click for space bar
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.frequency.value = 1200;
            osc.type = 'sine';

            gain.gain.value = 0.08;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.025);
        }

        function playLineFeed() {
            if (!audioCtx) return;
            // Whir sound for line feed
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.frequency.value = 300;
            osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            osc.type = 'sawtooth';

            gain.gain.value = 0.08;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playCarriageReturn() {
            if (!audioCtx) return;
            // Thunk for carriage return
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.frequency.value = 120;
            osc.type = 'sine';

            gain.gain.value = 0.2;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        let running = false;
        const output = document.getElementById('output');
        const input = document.getElementById('input');
        const greenbar = document.getElementById('greenbar');
        const startModal = document.getElementById('startModal');
        const startBtn = document.getElementById('startBtn');

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function scrollToBottom() {
            greenbar.scrollTop = greenbar.scrollHeight;
        }

        function getCharDelay() {
            // Base delay with slight randomness
            let delay = baseCharDelay + Math.random() * 30 - 15;
            // Occasional line noise pause
            if (Math.random() < noiseChance) {
                delay += noisePause + Math.random() * 150;
            }
            return delay;
        }

        async function typeChar(char) {
            if (char === '\n') {
                // LF then CR, each ~1/15 sec
                playLineFeed();
                await sleep(baseCharDelay);
                playCarriageReturn();
                await sleep(baseCharDelay);
                output.textContent += char;
                scrollToBottom();
            } else if (char === ' ') {
                playSpaceClick();
                output.textContent += char;
                scrollToBottom();
                await sleep(baseCharDelay);
            } else {
                playClick(char);
                output.textContent += char;
                scrollToBottom();
                await sleep(getCharDelay());
            }
        }

        async function typeLine(text) {
            for (const char of text) {
                await typeChar(char);
            }
            await typeChar('\n');
        }

        async function typeText(text) {
            for (const char of text) {
                await typeChar(char);
            }
        }

        async function runRace() {
            if (running) return;
            running = true;
            input.disabled = true;

            // Initialize positions
            const positions = {};
            horses.forEach(h => positions[h] = 0);

            // Header
            await typeLine('');
            await typeLine('==========================================');
            await typeLine('           THE RACE IS ON!');
            await typeLine('==========================================');
            await typeLine('');

            let round = 1;
            let winner = null;

            while (!winner) {
                await typeLine('--- ROUND ' + round + ' ---');

                // Move all horses first
                for (const horse of horses) {
                    const move = Math.floor(Math.random() * 3) + 1;
                    positions[horse] += move;
                    if (positions[horse] >= finishLine && !winner) {
                        winner = horse;
                    }
                }

                // Display horses (cap others at winner's position - 1 if winner exists)
                const winnerPos = winner ? positions[winner] : 999;
                for (const horse of horses) {
                    const displayPos = (winner && horse !== winner)
                        ? Math.min(positions[horse], winnerPos - 1)
                        : positions[horse];
                    const track = '*'.repeat(displayPos) + '>';
                    const paddedName = horse.padEnd(7);

                    await typeText(paddedName + ' |' + track);
                    await typeChar('\n');
                }

                await typeLine('');
                round++;
            }

            // Winner announcement
            await typeLine('==========================================');
            await typeLine('WINNER: ' + winner + ' !');
            await typeLine('==========================================');
            await typeLine('');

            running = false;
            input.disabled = false;
            input.focus();
            await promptForInput();
        }

        let inputBuffer = '';
        let waitingForInput = false;

        async function init() {
            output.textContent = '';
            await typeLine('TYPE HELP TO START');
            await typeLine('');
            await promptForInput();
        }

        async function startDemo() {
            startModal.classList.add('modal-hidden');
            initAudio();
            input.focus();
            // Small delay to ensure audio context is ready
            await sleep(100);
            await init();
        }

        async function promptForInput() {
            waitingForInput = false;
            // Print 6 spaces with sounds
            for (let i = 0; i < 6; i++) {
                playSpaceClick();
                output.textContent += ' ';
                scrollToBottom();
                await sleep(baseCharDelay);
            }
            waitingForInput = true;
            inputBuffer = '';
        }

        async function processCommand(cmd) {
            waitingForInput = false;
            await typeChar('\n');

            // Strip leading ) for APL system commands
            const aplCmd = cmd.startsWith(')') ? cmd.slice(1) : cmd;

            if (aplCmd === 'RACE') {
                await runRace();
            } else if (aplCmd === 'HELP' || aplCmd === '?') {
                await typeLine('');
                await typeLine('RACE   - RUN THE HORSE RACE');
                await typeLine(')FNS   - LIST FUNCTIONS');
                await typeLine(')VARS  - LIST VARIABLES');
                await typeLine(')WSID  - WORKSPACE ID');
                await typeLine(')OFF   - END SESSION');
                await typeLine('');
                await promptForInput();
            } else if (aplCmd === 'FNS') {
                await typeLine('DESCRIBE RACE');
                await typeLine('');
                await promptForInput();
            } else if (aplCmd === 'VARS') {
                await typeLine('ABOUT');
                await typeLine('');
                await promptForInput();
            } else if (aplCmd === 'DESCRIBE') {
                await typeLine('');
                await typeLine('CLASSIC 1970S APL\\360 HORSE RACE SIMULATION');
                await typeLine('FIVE HORSES ADVANCE RANDOMLY EACH ROUND');
                await typeLine('FIRST TO CROSS THE FINISH LINE WINS');
                await typeLine('');
                await promptForInput();
            } else if (aplCmd === 'ABOUT') {
                await typeLine('');
                await typeLine('LICENSE: MIT');
                await typeLine('COPYRIGHT (C) 2026 MICHAEL A. WRIGHT');
                await typeLine('GITHUB: SW-COMP-HISTORY');
                await typeLine('REPO: APL-HORSE-RACE');
                await typeLine('');
                await promptForInput();
            } else if (aplCmd === 'WSID') {
                await typeLine('HORSERACE');
                await typeLine('');
                await promptForInput();
            } else if (aplCmd === 'CLEAR') {
                // )CLEAR erases workspace - not implemented
                await typeLine('NOT IMPLEMENTED');
                await typeLine('');
                await promptForInput();
            } else if (aplCmd === 'OFF' || aplCmd === 'QUIT' || aplCmd === 'EXIT') {
                await typeLine('APL\\360 SESSION ENDED');
                await typeLine('');
                // Don't prompt - session ended
            } else if (cmd !== '') {
                await typeLine('SYNTAX ERROR');
                await typeLine('');
                await promptForInput();
            } else {
                await promptForInput();
            }
        }

        input.addEventListener('keydown', async function(e) {
            if (!waitingForInput || running) return;

            if (e.key === 'Enter') {
                e.preventDefault();
                const cmd = inputBuffer.trim().toUpperCase();
                processCommand(cmd);
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                if (inputBuffer.length > 0) {
                    inputBuffer = inputBuffer.slice(0, -1);
                    output.textContent = output.textContent.slice(0, -1);
                }
            } else if (e.key === 'Tab' || e.key === ' ') {
                e.preventDefault();
                inputBuffer += ' ';
                playSpaceClick();
                output.textContent += ' ';
                scrollToBottom();
            } else if (e.key.length === 1 && e.key.match(/[a-zA-Z0-9\-=*|!@#$%^&()_+\[\]{};':",.<>?\/\\`~]/)) {
                e.preventDefault();
                const char = e.key.toUpperCase();
                inputBuffer += char;
                playClick(char);
                output.textContent += char;
                scrollToBottom();
            }
        });

        // Start button click
        startBtn.addEventListener('click', startDemo);
    </script>
</body>
</html>
